<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kelola Akun</title><link rel="stylesheet" href="css/style.css"></head><body><div id="nav"></div><main class="container"><div class="page-head"><h2>Kelola Akun</h2></div><div class="panel"><div class="notice">Data akun disimpan langsung pada Firebase Realtime Database dengan SAP ID sebagai key.</div><form id="userForm" class="grid-form" style="margin-top:15px"><label>SAP ID<input id="sapId" required></label><label>Nama<input id="name" required></label><label>Password<input id="password" required></label><label>Role<select id="role"><option value="user">user</option><option value="admin">admin</option></select></label><div class="actions full"><button>Simpan</button><button type="button" class="secondary" id="resetBtn">Reset</button></div></form><div id="msg" class="message"></div></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>SAP</th><th>Nama</th><th>Password</th><th>Role</th><th>Aksi</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script type="module" src="js/users.js"></script></body></html>
