<!doctype html>
<html lang="id">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Edit Password - Overtime System</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <!-- =====================================================
         NAVIGASI
    ====================================================== -->

    <div id="nav"></div>


    <!-- =====================================================
         KONTEN UTAMA
    ====================================================== -->

    <main class="container">

        <div class="page-head">

            <h2>
                Edit Password
            </h2>

        </div>


        <div class="panel">

            <h3>
                Ganti Password
            </h3>

            <p>
                Silakan masukkan password lama dan password baru Anda.
            </p>


            <!-- =================================================
                 INFORMASI AKUN
            ================================================== -->

            <div class="form-group">

                <label for="sapId">
                    SAP ID
                </label>

                <input
                    type="text"
                    id="sapId"
                    readonly
                >

            </div>


            <div class="form-group">

                <label for="name">
                    Nama
                </label>

                <input
                    type="text"
                    id="name"
                    readonly
                >

            </div>


            <!-- =================================================
                 FORM PASSWORD
            ================================================== -->

            <form
                id="passwordForm"
                autocomplete="off"
            >

                <div class="form-group">

                    <label for="oldPassword">
                        Password Lama
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="oldPassword"
                            name="oldPassword"
                            placeholder="Masukkan password lama"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="oldPassword"
                        >
                            Lihat
                        </button>

                    </div>

                </div>


                <div class="form-group">

                    <label for="newPassword">
                        Password Baru
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="newPassword"
                            name="newPassword"
                            placeholder="Masukkan password baru"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="newPassword"
                        >
                            Lihat
                        </button>

                    </div>

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Konfirmasi Password Baru
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Ulangi password baru"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="confirmPassword"
                        >
                            Lihat
                        </button>

                    </div>

                </div>


                <!-- =================================================
                     PESAN
                ================================================== -->

                <div
                    id="passwordMsg"
                    class="message"
                    role="alert"
                    aria-live="polite"
                ></div>


                <!-- =================================================
                     BUTTON
                ================================================== -->

                <button
                    type="submit"
                    id="savePasswordButton"
                >
                    Simpan Password
                </button>

            </form>

        </div>

    </main>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script
        type="module"
        src="js/edit-password.js"
    ></script>

</body>

</html>
