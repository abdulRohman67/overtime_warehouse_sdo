<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Login - Overtime System</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

  <main class="login-card">

    <div class="login-header">
      <h1>Overtime System Warehouse PT.SDO</h1>
      <p>Silakan login menggunakan SAP ID dan password</p>
    </div>

    <form id="loginForm" autocomplete="off">

      <div class="form-group">
        <label for="sapId">SAP ID</label>
        <input
          type="text"
          id="sapId"
          name="sapId"
          placeholder="Masukkan SAP ID"
          autocomplete="username"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Masukkan password"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            id="togglePassword"
            class="toggle-password"
            aria-label="Tampilkan password"
          >
            Lihat
          </button>
        </div>
      </div>

      <button
        type="submit"
        id="loginButton"
        class="login-button"
      >
        Login
      </button>

      <div
        id="loginMsg"
        class="message"
        role="alert"
        aria-live="polite"
      ></div>

    </form>

    <div class="login-footer">
      <small>Overtime System</small>
    </div>

  </main>

  <script type="module" src="js/login.js"></script>

  <script>
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");

    togglePassword.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";

      passwordInput.type = isPassword ? "text" : "password";
      togglePassword.textContent = isPassword ? "Sembunyikan" : "Lihat";
      togglePassword.setAttribute(
        "aria-label",
        isPassword ? "Sembunyikan password" : "Tampilkan password"
      );
    });
  </script>

</body>
</html>
